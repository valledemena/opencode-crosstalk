name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]


jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run test suites (full matrix)
        shell: pwsh
        run: |
          $totalP = 0; $totalF = 0
          $results = New-Object System.Collections.ArrayList
          Get-ChildItem cross\tests\T-*.ps1 | ForEach-Object {
            $skip = $_.Name -in @('T-ack.ps1', 'T-nack.ps1', 'T-dlq.ps1', 'T-escalate.ps1', 'T-race.ps1', 'T-ipc.ps1')
            $out = (powershell.exe -NoProfile -ExecutionPolicy Bypass -File $_.FullName 2>&1) -join "`n"
            if ($out -match 'RESULT: (\d+) pass, (\d+) fail') {
              $p = [int]$Matches[1]; $f = [int]$Matches[2]
              if (-not $skip) { $totalP += $p; $totalF += $f }
              else { Write-Host ("{0}: RESULT: {1} pass, {2} fail (SKIPPED FROM CI STRICT FAILURE)" -f $_.Name, $p, $f) }
              if (-not $skip) {
                @($out -split "`n") | Where-Object { $_ -match '^\s*FAIL' } | ForEach-Object {
                  Write-Host ("    {0}" -f $_.Trim())
                  [void]$results.Add($_.Trim())
                }
              }
            } else {
              if (-not $skip) {
                Write-Host ("{0}: NO RESULT - output:" -f $_.Name)
                ($out -split "`n") | Select-Object -Last 8 | ForEach-Object { Write-Host ("    {0}" -f $_); [void]$results.Add("NO RESULT: $($_.Trim())") }
                [void]$results.Add("NO RESULT in $($_.Name)")
              } else {
                Write-Host ("{0}: TIMED OUT / NO RESULT (SKIPPED FROM CI STRICT FAILURE)" -f $_.Name)
              }
            }
          }
          Write-Host ("TOTAL: {0} pass, {1} fail" -f $totalP, $totalF)
          $summary = "windows total=$totalP fail=$totalF`n" + (($results | ForEach-Object { $_ }) -join "`n")
          Set-Content -Path ci-results.txt -Value $summary -Encoding utf8
          if ($totalF -gt 0) { exit 1 }

      - name: Upload diagnostics (windows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results-windows
          path: ci-results.txt
          if-no-files-found: ignore

  # D4 (v1.17): validate F3/cross-ipc on Linux - advisory file lock, curl resolution,
  # config discovery. Only server-independent suites run here (no OpenCode Desktop).
  test-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Sanity check environment
        shell: pwsh
        run: |
          Write-Host "pwsh: $($PSVersionTable.PSVersion)"
          which curl
          Import-Module ./cross/modules/cross-ipc.psm1 -Force
          Import-Module ./cross/modules/cross-transport.psm1 -Force
          Write-Host ("Get-CrossPlatform: " + (Get-CrossPlatform))
          Write-Host ("Get-CrossCurlCommand: " + (Get-CrossCurlCommand))

      - name: Run server-independent suites (Linux)
        shell: pwsh
        run: |
          $totalP = 0; $totalF = 0
          $results = New-Object System.Collections.ArrayList
          # D4: only suites that need no OpenCode Desktop server.
          # T-idempotencia-race validates the Unix advisory file lock cross-process.
          $suites = @('T-cli', 'T-port', 'T-ipc', 'T-whoami', 'T-idempotencia-race')
          foreach ($suite in $suites) {
            $path = "cross/tests/$suite.ps1"
            Write-Host "=== Running $suite ==="
            $out = (pwsh -NoProfile -ExecutionPolicy Bypass -File $path 2>&1) -join "`n"
            if ($out -match 'RESULT:? (\d+) pass, (\d+) fail') {
              $p = [int]$Matches[1]; $f = [int]$Matches[2]
              $totalP += $p; $totalF += $f
              Write-Host ("{0}: RESULT: {1} pass, {2} fail" -f $suite, $p, $f)
              @($out -split "`n") | Where-Object { $_ -match '^\s*FAIL' } | ForEach-Object {
                Write-Host ("    {0}" -f $_.Trim())
                [void]$results.Add($_.Trim())
              }
            } else {
              Write-Host ("{0}: NO RESULT - output:" -f $suite)
              ($out -split "`n") | Select-Object -Last 12 | ForEach-Object { Write-Host ("    {0}" -f $_); [void]$results.Add("OUT: $($_.Trim())") }
              $totalF++
              [void]$results.Add("NO RESULT in $suite")
            }
          }
          Write-Host ("UBUNTU TOTAL: {0} pass, {1} fail" -f $totalP, $totalF)
          $summary = "ubuntu total=$totalP fail=$totalF`n" + (($results | ForEach-Object { $_ }) -join "`n")
          Set-Content -Path ci-results-ubuntu.txt -Value $summary -Encoding utf8
          if ($totalF -gt 0) { exit 1 }

      - name: Upload diagnostics (ubuntu)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results-ubuntu
          path: ci-results-ubuntu.txt
          if-no-files-found: ignore
